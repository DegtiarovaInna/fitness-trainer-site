spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/fitness_db
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
springdoc.api-docs.path=/v1/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v1/api-docs
springdoc.swagger-ui.config-url=/v1/api-docs/swagger-config

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION}
jwt.resetExpiration=${JWT_RESET_EXPIRATION}

app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.sameSite=${APP_COOKIE_SAMESITE:Lax}

# openssl rand -base64 32

# Resilience4j RateLimiter  login

resilience4j.ratelimiter.instances.loginRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.loginRateLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.loginRateLimiter.timeout-duration=0

resilience4j.ratelimiter.instances.paymentRateLimiter.limit-for-period=3
resilience4j.ratelimiter.instances.paymentRateLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.paymentRateLimiter.timeout-duration=0

resilience4j.ratelimiter.instances.registerRateLimiter.limit-for-period= 5
resilience4j.ratelimiter.instances.registerRateLimiter.limit-refresh-period= 60s
resilience4j.ratelimiter.instances.registerRateLimiter.timeout-duration=0

logging.level.org.springframework.boot.env=TRACE

# SendGrid
app.sendgrid.api-key=${SENDGRID_API_KEY}
app.mail.from=${MAIL_FROM}


app.url.base=http://localhost:8080

# ---- Media storage (S3-compatible: MinIO, R2, AWS S3) ----
media.bucket=${MEDIA_BUCKET}
media.region=${MEDIA_REGION}
media.endpoint=${MEDIA_ENDPOINT}
media.accessKey=${MEDIA_ACCESS_KEY}
media.secretKey=${MEDIA_SECRET_KEY}
media.presignDuration=${MEDIA_PRESIGN_DURATION}



stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY}
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
